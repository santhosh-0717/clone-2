<!DOCTYPE html>

<head>

<body>
    <div id="app">
        <!-- Navigation Bar -->
        <nav id="navbar" class="hidden">
            <div class="nav-left">
                <a href="#" class="logo">
                    <img src="https://m.media-amazon.com/images/G/01/digital/video/avod/AV_Logo_150._CB430404026_.png"
                        alt="Prime Video" style="height: 24px;">
                </a>
                <ul class="nav-links">
                    <li><a href="#" class="nav-link active" data-page="home">Home</a></li>
                    <li><a href="#" class="nav-link" data-page="store">Store</a></li>
                    <li><a href="#" class="nav-link" data-page="movies">Movies</a></li>
                    <li><a href="#" class="nav-link" data-page="tv">TV Shows</a></li>
                    <li><a href="#" class="nav-link" data-page="live">Live TV</a></li>
                    <li><a href="#" class="nav-link" data-page="categories">Categories</a></li>
                </ul>
            </div>
            <div class="nav-right">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search">
                </div>
                <div class="user-menu">
                    <i class="fas fa-user-circle"></i>
                    <span id="usernameDisplay">User</span>
                    <div class="dropdown">
                        <a href="#" id="logoutBtn">Sign Out</a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- Dynamic Content will be injected here -->
        </main>

        <!-- Video Player Overlay -->
        <div id="video-player" class="hidden">
            <div class="player-header">
                <button id="closePlayer"><i class="fas fa-arrow-left"></i> Back</button>
            </div>
            <div class="video-container">
                <div class="placeholder-video">
                    <i class="fas fa-play-circle play-icon"></i>
                    <h2 id="playerTitle">Movie Title</h2>
                    <p>Playing Simulation...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Page Template (Hidden by default, used by JS) -->
    <template id="login-template">
        <div class="login-container">
            <div class="login-box">
                <img src="https://m.media-amazon.com/images/G/01/digital/video/avod/AV_Logo_150._CB430404026_.png"
                    alt="Prime Video" class="login-logo">
                <h1>Sign in</h1>
                <form id="loginForm">
                    <div class="input-group">
                        <label for="email">Email or mobile phone number</label>
                        <input type="text" id="email" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" class="auth-btn">Sign In</button>
                </form>
                <div class="divider">
                    <h5>New to Amazon?</h5>
                </div>
                <button class="create-account-btn">Create your Amazon account</button>
            </div>
        </div>
    </template>

    <!-- Home Page Template -->
    <template id="home-template">
        <div class="hero-section">
            <div class="hero-video-container">
                <video id="heroVideo" autoplay muted loop playsinline class="hero-video">
                    <source src="" type="video/mp4">
                </video>
            </div>
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h1 id="heroTitle">Featured Title</h1>
